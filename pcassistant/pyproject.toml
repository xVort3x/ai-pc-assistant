[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcassistant"
version = "1.0.0"
description = "Plugin-driven local AI PC assistant core"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[project.scripts]
pcassistant = "pcassistant.cli:main"

[tool.setuptools.packages.find]
include = ["pcassistant*"]
